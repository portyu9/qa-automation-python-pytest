[pytest]
minversion = 8.0
addopts = -ra --strict-config --strict-markers --showlocals
testpaths = tests
markers =
    unit: deterministic tests with no external I/O
    api: HTTP/API behavior tests
    contract: schema or consumer/provider contract verification
    integration: integration tests crossing a process or infrastructure boundary
    db: persistence and database verification
    e2e: browser or full workflow tests
    smoke: narrow release-health checks
    security: security-focused checks requiring dedicated prerequisites
    performance: performance/load-related checks excluded from the fast gate
    serial: test requires exclusive access to shared mutable state
filterwarnings =
    error
    ignore::DeprecationWarning:pkg_resources.*
