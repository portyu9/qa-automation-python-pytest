[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "reports", "artifacts"]

[tool.ruff.lint]
# Keep automated linting focused on correctness, bug patterns, and simple
# semantic improvements. Broader formatting/style policy should be introduced
# deliberately so mechanical churn remains separate from behavioral changes.
select = ["E", "F", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
