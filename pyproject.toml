[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "reports", "artifacts"]

[tool.ruff.lint]
# Start with correctness-focused rules across the entire existing codebase.
# Import/modernization/typography rules can be added once the legacy baseline
# is reformatted in a dedicated mechanical change rather than hiding real CI
# failures inside the framework upgrade.
select = ["E", "F", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
# pytest.ini remains the single source of execution policy. This section is
# intentionally empty to avoid split configuration ownership.

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
