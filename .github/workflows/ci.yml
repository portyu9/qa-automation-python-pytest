name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TEST_BASE_URL: https://jsonplaceholder.typicode.com
  TEST_UI_BASE_URL: http://127.0.0.1:5000/ui
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -m compileall -q src tests
      - name: Validate xdist run-manifest ownership
        env:
          TEST_REPORT_DIR: reports/xdist-contract
        run: |
          pytest tests/framework/test_configuration_contract.py tests/framework/test_run_manifest.py -n 2
          python - <<'PY'
          import json
          from pathlib import Path

          report_dir = Path("reports/xdist-contract")
          manifest_path = report_dir / "run-manifest.json"
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert payload["summary"]["total"] > 0
          assert not list(report_dir.glob("*.tmp"))
          print(f"xdist manifest outcomes={payload['summary']['total']}")
          PY

  functional:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run fast test gate
        run: >-
          pytest
          --ignore=tests/e2e
          --ignore=tests/performance
          --ignore=tests/security
          --junitxml=reports/junit-${{ matrix.python }}.xml
          --cov=src
          --cov-report=xml:reports/coverage-${{ matrix.python }}.xml
          --cov-report=term-missing
      - name: Publish functional observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schemaVersion": 1,
              "framework": "pytest",
              "runId": os.environ["TEST_RUN_ID"],
              "dimension": {"python": os.environ["PYTHON_VERSION"]},
              "status": os.environ["JOB_STATUS"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
          }
          Path(f"reports/ci-observability-python-{os.environ['PYTHON_VERSION']}.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          {
            echo "### pytest fast gate · Python ${{ matrix.python }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- Evidence: JUnit + coverage XML + run manifest + CI observability envelope'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload functional evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-${{ matrix.python }}-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run deterministic Chrome/Selenium gate
        env:
          TEST_BROWSER: chrome
          TEST_HEADLESS: "true"
          TEST_REPORT_DIR: reports/browser
        run: pytest tests/e2e --junitxml=reports/browser/junit.xml
      - name: Publish browser observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports/browser
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schemaVersion": 1,
              "framework": "pytest-selenium",
              "runId": os.environ["TEST_RUN_ID"],
              "dimension": {"python": "3.12", "browser": "chrome"},
              "status": os.environ["JOB_STATUS"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
          }
          Path("reports/browser/ci-observability-browser.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          {
            echo '### pytest / Selenium · Chrome'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- Evidence: JUnit + run manifest + redacted browser failure diagnostics'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: reports/browser/
          if-no-files-found: ignore
          retention-days: 14
