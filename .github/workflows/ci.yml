name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TEST_BASE_URL: https://jsonplaceholder.typicode.com

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -m compileall -q src tests

  functional:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run fast test gate
        run: >-
          pytest
          --ignore=tests/e2e
          --ignore=tests/performance
          --ignore=tests/security
          --junitxml=reports/junit-${{ matrix.python }}.xml
          --cov=src
          --cov-report=xml:reports/coverage-${{ matrix.python }}.xml
          --cov-report=term-missing
      - name: Upload functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python }}-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        env:
          TEST_BROWSER: chromium
          TEST_HEADLESS: "true"
        run: pytest tests/e2e --junitxml=reports/e2e.xml
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            reports/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
