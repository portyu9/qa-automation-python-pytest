name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-pytest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TEST_BASE_URL: http://127.0.0.1:5000
  TEST_UI_BASE_URL: http://127.0.0.1:5000/ui
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock/python-3.14.txt
      - name: Install hash-locked Python 3.14 dependency graph
        run: python -m pip install --require-hashes -r requirements-lock/python-3.14.txt
      - name: Validate lock provenance and installed graph
        run: |
          python .github/scripts/validate_dependency_locks.py
          python -m pip check
      - name: Lint Python
        run: ruff check .
      - name: Compile Python sources, tests, and repository validators
        run: python -m compileall -q src tests .github/scripts
      - name: Validate xdist run-manifest ownership
        env:
          TEST_REPORT_DIR: reports/xdist-contract
        run: |
          pytest tests/framework/test_configuration_contract.py tests/framework/test_run_manifest.py -n 2
          python - <<'PY'
          import json
          from pathlib import Path

          report_dir = Path("reports/xdist-contract")
          manifest_path = report_dir / "run-manifest.json"
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert payload["summary"]["total"] > 0
          assert payload["summary"]["failed"] == 0
          assert not list(report_dir.glob("*.tmp"))
          print(f"xdist manifest outcomes={payload['summary']['total']}")
          PY

  functional:
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock/python-${{ matrix.python }}.txt
      - name: Install hash-locked dependency graph for Python ${{ matrix.python }}
        run: |
          python -m pip install --require-hashes -r "requirements-lock/python-${{ matrix.python }}.txt"
          python -m pip check
      - name: Run fast test gate
        run: >-
          pytest
          --ignore=tests/e2e
          --ignore=tests/performance
          --ignore=tests/security
          --junitxml=reports/junit-${{ matrix.python }}.xml
          --cov=src
          --cov-report=xml:reports/coverage-${{ matrix.python }}.xml
          --cov-report=term-missing
      - name: Validate meaningful fast-test evidence
        run: >-
          python .github/scripts/validate_test_evidence.py functional
          reports/junit-${{ matrix.python }}.xml
          reports/coverage-${{ matrix.python }}.xml
          reports/run-manifest.json
          50
      - name: Publish functional observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schemaVersion": 1,
              "framework": "pytest",
              "runId": os.environ["TEST_RUN_ID"],
              "dimension": {"python": os.environ["PYTHON_VERSION"]},
              "status": os.environ["JOB_STATUS"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
          }
          Path(f"reports/ci-observability-python-{os.environ['PYTHON_VERSION']}.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          {
            echo "### pytest fast gate · Python ${{ matrix.python }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- Dependencies: interpreter-specific hash-locked graph (`--require-hashes`) + `pip check`'
            echo '- Evidence: >=50 executed tests, zero failures/errors, reconciled JUnit/run manifest, coverage XML >=70% line floor + measured branch counters, CI observability envelope'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload functional evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python }}-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14

  browser:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock/python-3.14.txt
      - name: Install hash-locked Python 3.14 dependency graph
        run: |
          python -m pip install --require-hashes -r requirements-lock/python-3.14.txt
          python -m pip check
      - name: Run deterministic Chrome/Selenium gate
        env:
          TEST_BROWSER: chrome
          TEST_HEADLESS: "true"
          TEST_REPORT_DIR: reports/browser
        run: pytest tests/e2e --junitxml=reports/browser/junit.xml
      - name: Validate meaningful browser evidence
        run: >-
          python .github/scripts/validate_test_evidence.py browser
          reports/browser/junit.xml
          reports/browser/run-manifest.json
          1
      - name: Publish browser observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports/browser
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schemaVersion": 1,
              "framework": "pytest-selenium",
              "runId": os.environ["TEST_RUN_ID"],
              "dimension": {"python": "3.14", "browser": "chrome"},
              "status": os.environ["JOB_STATUS"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
          }
          Path("reports/browser/ci-observability-browser.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          {
            echo '### pytest / Selenium · Chrome · Python 3.14'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- Dependencies: Python 3.14 hash-locked graph (`--require-hashes`) + `pip check`'
            echo '- Evidence: >=1 executed browser test, zero failures/errors, reconciled JUnit + run manifest + redacted browser failure diagnostics'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: reports/browser/
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: ci-gate
    if: always()
    needs: [quality, functional, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require quality, interpreter matrix, and browser gate
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          FUNCTIONAL_RESULT: ${{ needs.functional.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          if [[ "$QUALITY_RESULT" != "success" || "$FUNCTIONAL_RESULT" != "success" || "$BROWSER_RESULT" != "success" ]]; then
            echo "quality=$QUALITY_RESULT functional=$FUNCTIONAL_RESULT browser=$BROWSER_RESULT" >&2
            exit 1
          fi
          echo "Python quality, interpreter matrix, and deterministic browser gate passed."
