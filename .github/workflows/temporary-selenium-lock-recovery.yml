name: temporary-selenium-lock-recovery

on:
  push:
    branches:
      - dependabot/pip/selenium-gte-4.49.0-and-lt-5
    paths:
      - requirements.txt
      - .github/workflows/temporary-selenium-lock-recovery.yml

permissions:
  contents: read

concurrency:
  group: temporary-selenium-lock-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    name: Python ${{ matrix.python }} recovery lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout exact recovery head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned lock compiler
        run: python -m pip install --disable-pip-version-check --no-input "pip-tools==7.6.1"
      - name: Compile hash-locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-locks
          pip-compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file "generated-locks/python-${{ matrix.python }}.txt" \
            requirements.txt
      - name: Verify strict hash installation
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r "generated-locks/python-${{ matrix.python }}.txt"
      - name: Upload one recovery lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python }}-lock
          path: generated-locks/python-${{ matrix.python }}.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false

  publish:
    name: validate and publish recovery locks
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact recovery head with branch credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download only this run's generated lock artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lock-artifacts
          mkdir -p lock-artifacts
          gh run download "$GITHUB_RUN_ID" --dir lock-artifacts --pattern 'python-*-lock'
      - name: Validate artifacts and materialize governed lock set
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, ".github/scripts")
          from dependency_lock_publisher import build_manifest, validate_artifact_tree

          source = Path("requirements.txt").read_bytes()
          locks = validate_artifact_tree(Path("lock-artifacts"), source.decode("utf-8"))
          destination = Path("requirements-lock")
          destination.mkdir(exist_ok=True)
          for version, data in locks.items():
              (destination / f"python-{version}.txt").write_bytes(data)
          (destination / "manifest.json").write_bytes(build_manifest(source, locks))
          PY
          python .github/scripts/validate_dependency_locks.py
      - name: Commit generated lock artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git add requirements-lock/manifest.json requirements-lock/python-3.11.txt requirements-lock/python-3.12.txt requirements-lock/python-3.13.txt requirements-lock/python-3.14.txt
          if git diff --cached --quiet; then
            echo "Generated lock set already matches the branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh generated dependency locks"
          git push origin "HEAD:${GITHUB_REF_NAME}"
