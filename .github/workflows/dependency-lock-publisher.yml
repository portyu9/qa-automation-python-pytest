name: dependency-lock-publisher

on:
  workflow_run:
    workflows: [dependency-locks]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependency-lock-publisher-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-generated-locks
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted default-branch publisher code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate immutable workflow dependencies
        run: python3 .github/scripts/validate_workflow_pins.py
      - name: Download only lock artifacts from the completed read-only run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lock-artifacts
          mkdir -p lock-artifacts
          gh run download "$SOURCE_RUN_ID" --dir lock-artifacts --pattern 'python-*-lock'
      - name: Validate provenance and atomically publish generated locks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/dependency_lock_publisher.py --artifact-root lock-artifacts
