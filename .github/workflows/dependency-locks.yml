name: dependency-locks

on:
  pull_request:
    paths:
      - "requirements.txt"
      - ".github/workflows/dependency-locks.yml"

permissions:
  contents: read

concurrency:
  group: dependency-locks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Python ${{ matrix.python }} hash lock
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout exact pull-request merge candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned lock compiler
        run: python -m pip install --disable-pip-version-check --no-input "pip-tools==7.6.1"
      - name: Compile hash-locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-locks
          pip-compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file "generated-locks/python-${{ matrix.python }}.txt" \
            requirements.txt
      - name: Verify strict hash installation
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes -r "generated-locks/python-${{ matrix.python }}.txt"
      - name: Upload one interpreter lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-${{ matrix.python }}-lock
          path: generated-locks/python-${{ matrix.python }}.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false
