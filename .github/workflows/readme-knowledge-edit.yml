name: readme-knowledge-edit

on: [push]

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/readme-knowledge
      - run: python3 .github/scripts/apply_readme_knowledge.py
      - run: python3 .github/scripts/validate_readme.py
      - name: Commit reviewed README change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/readme-knowledge-edit.yml .github/scripts/apply_readme_knowledge.py
          git add README.md
          git commit -m 'docs: sharpen README confidence boundaries'
          git push origin HEAD:docs/readme-knowledge
