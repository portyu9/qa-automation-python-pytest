name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "conftest.py"
      - "requirements.txt"
      - "requirements-lock/**"
      - "pyproject.toml"
      - "contract/**"
      - "performance/**"
      - "src/browser.py"
      - "src/config.py"
      - "src/pages/**"
      - "mock/**"
      - "tests/contract/**"
      - "tests/e2e/**"
      - "tests/performance/**"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "41 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TEST_BASE_URL: http://127.0.0.1:5000
      TEST_UI_BASE_URL: http://127.0.0.1:5000/ui
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_HEADLESS: "true"
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}
      TEST_REPORT_DIR: reports/${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock/python-3.12.txt
      - name: Install hash-locked Python 3.12 dependency graph
        run: python -m pip install --require-hashes -r requirements-lock/python-3.12.txt
      - name: Run Selenium compatibility contract
        run: >-
          pytest tests/e2e
          --junitxml=reports/${{ matrix.browser }}/junit.xml
      - name: Publish browser observability summary
        if: always()
        run: |
          mkdir -p "reports/${{ matrix.browser }}"
          {
            echo "### pytest / Selenium · ${{ matrix.browser }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Browser: \`${{ matrix.browser }}\`"
            echo "- Python: \`3.12\`"
            echo '- Dependencies: hash-locked graph (`--require-hashes`)'
            echo "- Job status: \`${{ job.status }}\`"
            echo "- Evidence: JUnit + controller-owned run manifest + bounded failure diagnostics"
          } | tee "reports/${{ matrix.browser }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-${{ matrix.browser }}-extended-evidence
          path: reports/${{ matrix.browser }}/
          if-no-files-found: ignore
          retention-days: 14

  performance-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TEST_BASE_URL: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock/python-3.12.txt
      - name: Install hash-locked Python 3.12 dependency graph
        run: python -m pip install --require-hashes -r requirements-lock/python-3.12.txt
      - name: Verify Locust target policy without traffic
        run: pytest tests/performance
      - name: Run bounded Locust script-health smoke against owned fixture
        shell: bash
        run: |
          set -euo pipefail
          ready_file="$(mktemp)"
          rm -f "$ready_file"
          MOCK_READY_FILE="$ready_file" python mock/server.py > /tmp/python-locust-fixture.log 2>&1 &
          fixture_pid=$!
          cleanup() {
            kill "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
            rm -f "$ready_file"
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..50}; do
            if ! kill -0 "$fixture_pid" 2>/dev/null; then
              cat /tmp/python-locust-fixture.log >&2
              exit 1
            fi
            if [[ -s "$ready_file" ]]; then
              python - "$ready_file" "$fixture_pid" <<'PY'
          import json
          import sys
          from pathlib import Path

          token = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert token == {"pid": int(sys.argv[2]), "host": "127.0.0.1", "port": 5000}
          PY
              ready=true
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" != "true" ]]; then
            echo "repository-owned fixture did not publish its ownership token" >&2
            cat /tmp/python-locust-fixture.log >&2
            exit 1
          fi

          locust \
            -f performance/locustfile.py \
            --headless \
            --host "$TEST_BASE_URL" \
            --users 1 \
            --spawn-rate 1 \
            --run-time 3s \
            --only-summary \
            --exit-code-on-error 1
