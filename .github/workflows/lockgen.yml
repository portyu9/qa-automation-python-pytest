name: lockgen

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-lock/**"
      - ".github/workflows/lockgen.yml"

permissions:
  contents: write

jobs:
  compile-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Compile Python 3.11 lock
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - run: python -m pip install "pip-tools==7.6.1"
      - run: |
          mkdir -p requirements-lock
          pip-compile --generate-hashes --resolver=backtracking --strip-extras \
            --output-file requirements-lock/python-3.11.txt requirements.txt
          python -m pip install --require-hashes -r requirements-lock/python-3.11.txt

      - name: Compile Python 3.12 lock
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install "pip-tools==7.6.1"
      - run: |
          pip-compile --generate-hashes --resolver=backtracking --strip-extras \
            --output-file requirements-lock/python-3.12.txt requirements.txt
          python -m pip install --require-hashes -r requirements-lock/python-3.12.txt

      - name: Compile Python 3.13 lock
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install "pip-tools==7.6.1"
      - run: |
          pip-compile --generate-hashes --resolver=backtracking --strip-extras \
            --output-file requirements-lock/python-3.13.txt requirements.txt
          python -m pip install --require-hashes -r requirements-lock/python-3.13.txt

      - name: Commit generated locks to audit branch
        shell: bash
        run: |
          set -euo pipefail
          git add requirements-lock/
          if git diff --cached --quiet; then
            echo 'Generated lockfiles already match the branch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'deps: commit generated Python lockfiles'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
