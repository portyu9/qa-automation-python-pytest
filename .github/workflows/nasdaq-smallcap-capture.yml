name: Nasdaq small-cap snapshot capture

on:
  push:
    branches:
      - data-capture/nasdaq-smallcap-20260803
    paths:
      - .github/workflows/nasdaq-smallcap-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: data-capture/nasdaq-smallcap-20260803
          fetch-depth: 0

      - name: Fetch and validate official Nasdaq small-cap snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request
          from datetime import datetime, timezone

          url = "https://api.nasdaq.com/api/screener/stocks?tableonly=true&limit=10000&marketcap=small"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Origin": "https://www.nasdaq.com",
              "Referer": "https://www.nasdaq.com/market-activity/stocks/screener",
          }
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=45) as response:
              raw = response.read()
              status = response.status
              response_headers = dict(response.headers.items())

          if status != 200:
              raise SystemExit(f"Nasdaq returned HTTP {status}")

          payload = json.loads(raw)
          rows = (((payload.get("data") or {}).get("table") or {}).get("rows") or [])
          total = (payload.get("data") or {}).get("totalrecords")
          if not isinstance(rows, list) or len(rows) < 500:
              raise SystemExit(f"Unexpected row count: {len(rows) if isinstance(rows, list) else 'non-list'}")
          if len(rows) > 5000:
              raise SystemExit(f"Unexpectedly large small-cap result: {len(rows)}")

          required = {"symbol", "name", "lastsale", "marketCap", "country"}
          malformed = []
          out_of_band = []
          for index, row in enumerate(rows):
              missing = sorted(required.difference(row))
              if missing:
                  malformed.append({"index": index, "symbol": row.get("symbol"), "missing": missing})
              cap = row.get("marketCap")
              try:
                  cap_value = float(cap)
              except (TypeError, ValueError):
                  cap_value = None
              if cap_value is not None and not (300_000_000 <= cap_value <= 2_000_000_000):
                  out_of_band.append({"index": index, "symbol": row.get("symbol"), "marketCap": cap})

          if malformed:
              raise SystemExit(f"Malformed rows found: {malformed[:10]}")
          if len(out_of_band) > 10:
              raise SystemExit(f"Too many out-of-band rows: {len(out_of_band)}; sample={out_of_band[:10]}")

          captured_at = datetime.now(timezone.utc).isoformat()
          digest = hashlib.sha256(raw).hexdigest()
          target = pathlib.Path(".scan-artifacts/nasdaq-smallcap-20260803")
          target.mkdir(parents=True, exist_ok=True)
          (target / "nasdaq-smallcap-official.json").write_bytes(raw)
          metadata = {
              "source": "Nasdaq official screener",
              "url": url,
              "captured_at_utc": captured_at,
              "http_status": status,
              "response_headers": response_headers,
              "raw_sha256": digest,
              "row_count": len(rows),
              "reported_totalrecords": total,
              "foreign_country_rows": sum(1 for row in rows if row.get("country") and row.get("country") != "United States"),
              "blank_country_rows": sum(1 for row in rows if not row.get("country")),
              "out_of_band_rows": out_of_band,
              "schema_required_fields": sorted(required),
          }
          (target / "capture-metadata.json").write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (target / "SHA256SUMS").write_text(f"{digest}  nasdaq-smallcap-official.json\n", encoding="utf-8")
          print(json.dumps(metadata, indent=2, sort_keys=True))
          PY

      - name: Commit immutable capture to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "framework-v2-capture"
          git config user.email "framework-v2-capture@users.noreply.github.com"
          git add .scan-artifacts/nasdaq-smallcap-20260803
          git commit -m "data: capture official Nasdaq small-cap snapshot"
          git push origin HEAD:data-capture/nasdaq-smallcap-20260803
