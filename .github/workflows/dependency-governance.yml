name: dependency-governance

on:
  pull_request:
    paths:
      - '.github/dependency-governance.json'
      - '.github/scripts/dependency_governance.py'
      - '.github/scripts/dependency_governance_selfcheck.py'
      - '.github/workflows/dependency-governance.yml'
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [ci, extended, security, docs]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Open Dependabot pull request number to re-evaluate'
        required: true
        type: string
      allow-merge:
        description: 'Permit merge if every governance proof is satisfied'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dependency-governance-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch || inputs['pr-number'] || github.ref_name || github.run_id }}-${{ github.event_name == 'pull_request' && 'self-test' || 'reconcile' }}
  cancel-in-progress: false

env:
  GOVERNANCE_CONFIG: .github/dependency-governance.json

jobs:
  self-test:
    name: governance-self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout proposed governance code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Compile governance control plane
        run: python -m compileall -q .github/scripts/dependency_governance.py .github/scripts/dependency_governance_selfcheck.py
      - name: Validate governance configuration
        run: python .github/scripts/dependency_governance.py --validate-config
      - name: Exercise dependency-governance policy self-check
        run: python .github/scripts/dependency_governance_selfcheck.py

  govern:
    name: govern-dependabot
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted default-branch governance code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate trusted governance configuration
        run: python .github/scripts/dependency_governance.py --validate-config
      - name: Reconcile dependency governance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_MERGE: ${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' || inputs['allow-merge'] }}
        run: python .github/scripts/dependency_governance.py
