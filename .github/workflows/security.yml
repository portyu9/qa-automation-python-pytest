name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  trivy:
    name: Trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare evidence directory
        run: mkdir -p reports/security
      - name: Scan repository security domains
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: reports/security/trivy.json
          exit-code: "1"
      - name: Require and summarize Trivy evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=reports/security/trivy.json
          summary=reports/security/summary.md
          if [[ ! -s "$report" ]]; then
            printf '### Security gate\n\nTrivy did not produce JSON evidence.\n' | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          vulnerabilities=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' "$report")
          misconfigurations=$(jq '[.Results[]? | .Misconfigurations[]?] | length' "$report")
          findings=$(jq '[.Results[]? | .Secrets[]?] | length' "$report")
          {
            echo '### Repository security gate'
            echo
            echo "- Fixed HIGH/CRITICAL vulnerabilities: ${vulnerabilities}"
            echo "- HIGH/CRITICAL misconfigurations: ${misconfigurations}"
            echo "- Gated credential-pattern findings: ${findings}"
            echo '- Scanner: Trivy v0.74.0'
          } | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-security-evidence-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe GitHub Dependency graph
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Dependency graph is unavailable; change-aware Dependency Review cannot run.'
            {
              echo '### Dependency Review fallback'
              echo
              echo 'GitHub Dependency graph is unavailable. Independent Trivy remains required.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Confirm fallback scope
        if: steps.dependency-graph.outputs.available != 'true'
        run: echo 'Dependency Review unavailable; repository-wide Trivy remains the independent dependency/configuration gate.'

  security-gate:
    name: security-gate
    if: always()
    needs: [codeql, trivy, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require applicable security jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          [[ "$TRIVY_RESULT" == "success" ]] || { echo "trivy=$TRIVY_RESULT"; exit 1; }
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$DEPENDENCY_REVIEW_RESULT" == "success" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW_RESULT"; exit 1; }
            if [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
              [[ "$CODEQL_RESULT" == "success" ]] || { echo "codeql=$CODEQL_RESULT"; exit 1; }
            else
              [[ "$CODEQL_RESULT" == "skipped" ]] || { echo "fork-codeql=$CODEQL_RESULT"; exit 1; }
            fi
          else
            [[ "$CODEQL_RESULT" == "success" ]] || { echo "codeql=$CODEQL_RESULT"; exit 1; }
            [[ "$DEPENDENCY_REVIEW_RESULT" == "skipped" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW_RESULT"; exit 1; }
          fi
