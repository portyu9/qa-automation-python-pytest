name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      governance-base-sha:
        description: 'Trusted governance base SHA for exact-head dependency review'
        required: false
        type: string
      governance-head-sha:
        description: 'Trusted governance head SHA for exact-head dependency review'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-policy:
    name: Supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate trusted governance qualification subject
        if: github.event_name == 'workflow_dispatch' && (inputs.governance-base-sha != '' || inputs.governance-head-sha != '')
        shell: bash
        env:
          GOVERNANCE_BASE_SHA: ${{ inputs.governance-base-sha }}
          GOVERNANCE_HEAD_SHA: ${{ inputs.governance-head-sha }}
        run: |
          set -euo pipefail
          [[ "$GOVERNANCE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GOVERNANCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GOVERNANCE_HEAD_SHA" == "$GITHUB_SHA" ]]
      - name: Validate immutable workflow dependencies and lock provenance
        run: |
          python .github/scripts/validate_workflow_pins.py
          python .github/scripts/validate_dependency_locks.py

  codeql:
    name: CodeQL
    needs: [supply-chain-policy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate zero-alert security implementation
        run: |
          python -m py_compile .github/scripts/validate_codeql_sarif.py .github/scripts/validate_codeql_sarif_selfcheck.py .github/scripts/validate_security_stack.py
          python .github/scripts/validate_codeql_sarif_selfcheck.py
          python .github/scripts/validate_security_stack.py
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: python,actions
          queries: security-extended
      - name: Analyze
        id: analyze-source
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: reports/security/codeql-source
      - name: Enforce zero CodeQL alerts
        env:
          SARIF_DIR: ${{ steps.analyze-source.outputs.sarif-output }}
        run: python .github/scripts/validate_codeql_sarif.py "$SARIF_DIR"
      - name: Upload CodeQL SARIF evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: reports/security/codeql-source/
          if-no-files-found: error
          retention-days: 14

  trivy:
    name: Trivy
    needs: [supply-chain-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare attributable pip lock inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/security/trivy-input
          for version in 3.11 3.12 3.13 3.14; do
            target="reports/security/trivy-input/python-${version}"
            mkdir -p "$target"
            cp "requirements-lock/python-${version}.txt" "$target/requirements.txt"
          done
      - name: Scan hash-locked dependencies, configuration, and repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: reports/security/trivy.json
          exit-code: "1"
      - name: Require attributed Trivy evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=reports/security/trivy.json
          summary=reports/security/summary.md
          python .github/scripts/validate_security_evidence.py "$report"
          vulnerabilities=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' "$report")
          package_targets=$(jq '[.Results[]? | select(((.Target // "") | contains("trivy-input/python-")) and ((.Target // "") | endswith("requirements.txt")))] | length' "$report")
          packages=$(jq '[.Results[]? | select(((.Target // "") | contains("trivy-input/python-")) and ((.Target // "") | endswith("requirements.txt"))) | .Packages[]? | (.Name + "@" + .Version)] | unique | length' "$report")
          misconfigurations=$(jq '[.Results[]? | .Misconfigurations[]?] | length' "$report")
          findings=$(jq '[.Results[]? | .Secrets[]?] | length' "$report")
          {
            echo '### Repository security gate'
            echo
            echo "- Attributed Python lock targets: ${package_targets} / 4"
            echo "- Unique Python packages represented: ${packages}"
            echo "- Fixed HIGH/CRITICAL vulnerabilities: ${vulnerabilities}"
            echo "- HIGH/CRITICAL misconfigurations: ${misconfigurations}"
            echo "- Gated credential-pattern findings: ${findings}"
            echo '- Scanner: Trivy v0.74.0'
            echo '- Dependency evidence: all four committed interpreter-specific hash locks are copied to scanner-recognized requirements.txt inputs; the validator requires every direct dependency at its exact resolved version in each attributed package inventory'
          } | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-security-evidence-${{ github.run_id }}
          path: |
            reports/security/trivy.json
            reports/security/summary.md
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: dependency-review
    needs: [supply-chain-policy]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.governance-base-sha != '' && inputs.governance-head-sha != '')
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe the actual pull-request Dependency Review comparison API
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Missing immutable PR base/head SHAs for Dependency Review.'
            exit 1
          }
          response="$RUNNER_TEMP/dependency-review-comparison.json"
          if ! status="$(curl --silent --show-error --max-time 20 --retry 2 \
            --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA")"; then
            echo '::error::Dependency Review comparison API transport failed; refusing degraded success.'
            exit 1
          fi
          if [[ "$status" == 200 ]]; then
            jq -e 'type == "array"' "$response" >/dev/null || {
              echo '::error::Dependency Review comparison API returned malformed data.'
              exit 1
            }
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Authenticated PR dependency comparison succeeded; run change-aware Dependency Review.'
          elif [[ "$status" == 403 || "$status" == 404 ]]; then
            message="$(jq -r 'if type == "object" then (.message // "unspecified") else "non-JSON API error" end' "$response" 2>/dev/null | tr '\n' ' ' | cut -c 1-200 || true)"
            if [[ "${message,,}" == *"rate limit"* || "${message,,}" == *"abuse detection"* ]]; then
              echo "::error::Dependency Review API rate-limited the request (HTTP $status); refusing false degraded status."
              exit 1
            fi
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub PR dependency comparison returned HTTP $status: $message. Change-aware Dependency Review is NOT operational. Independent repository vulnerability scans remain required but are not equivalent."
            {
              echo '### Dependency Review: confirmed degraded coverage'
              echo
              echo "- Exact PR dependency comparison: HTTP $status ($message)."
              echo '- GitHub Dependency Review action was not run. The required independent npm/Python/Maven/NuGet/image/Trivy gates remain unchanged, not equivalent to PR change review.'
              echo '- Enable/configure Dependency Graph and proper GitHub Actions token access in repository security settings to restore this control.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Unexpected Dependency Review API HTTP $status; refusing degraded success."
            exit 1
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || inputs.governance-base-sha }}
          head-ref: ${{ github.event.pull_request.head.sha || inputs.governance-head-sha }}
      - name: Confirm fallback scope
        if: steps.dependency-graph.outputs.available != 'true'
        run: echo 'Dependency Review unavailable; attributed Trivy hash-lock scanning remains the independent dependency/configuration gate.'

  security-gate:
    name: security-gate
    if: always()
    needs: [supply-chain-policy, codeql, trivy, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require applicable security jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          GOVERNANCE_QUALIFICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.governance-base-sha != '' && inputs.governance-head-sha != '' }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain-policy.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          [[ "$SUPPLY_CHAIN_RESULT" == "success" ]] || { echo "supply-chain-policy=$SUPPLY_CHAIN_RESULT"; exit 1; }
          [[ "$TRIVY_RESULT" == "success" ]] || { echo "trivy=$TRIVY_RESULT"; exit 1; }
          if [[ "$EVENT_NAME" == "pull_request" || "$GOVERNANCE_QUALIFICATION" == "true" ]]; then
            [[ "$DEPENDENCY_REVIEW_RESULT" == "success" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW_RESULT"; exit 1; }
            if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
              [[ "$CODEQL_RESULT" == "skipped" ]] || { echo "fork-codeql=$CODEQL_RESULT"; exit 1; }
            else
              [[ "$CODEQL_RESULT" == "success" ]] || { echo "codeql=$CODEQL_RESULT"; exit 1; }
            fi
          else
            [[ "$CODEQL_RESULT" == "success" ]] || { echo "codeql=$CODEQL_RESULT"; exit 1; }
            [[ "$DEPENDENCY_REVIEW_RESULT" == "skipped" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW_RESULT"; exit 1; }
          fi
