name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-policy:
    name: Supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate immutable workflow dependencies and lock provenance
        run: |
          python .github/scripts/validate_workflow_pins.py
          python .github/scripts/validate_dependency_locks.py

  codeql:
    name: CodeQL
    needs: [supply-chain-policy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  trivy:
    name: Trivy
    needs: [supply-chain-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare attributable pip lock inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/security/trivy-input
          for version in 3.11 3.12 3.13 3.14; do
            target="reports/security/trivy-input/python-${version}"
            mkdir -p "$target"
            cp "requirements-lock/python-${version}.txt" "$target/requirements.txt"
          done
      - name: Scan hash-locked dependencies, configuration, and repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: reports/security/trivy.json
          exit-code: "1"
      - name: Require attributed Trivy evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=reports/security/trivy.json
          summary=reports/security/summary.md
          python .github/scripts/validate_security_evidence.py "$report"
          vulnerabilities=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' "$report")
          package_targets=$(jq '[.Results[]? | select(((.Target // "") | contains("trivy-input/python-")) and ((.Target // "") | endswith("requirements.txt")))] | length' "$report")
          packages=$(jq '[.Results[]? | select(((.Target // "") | contains("trivy-input/python-")) and ((.Target // "") | endswith("requirements.txt"))) | .Packages[]? | (.Name + "@" + .Version)] | unique | length' "$report")
          misconfigurations=$(jq '[.Results[]? | .Misconfigurations[]?] | length' "$report")
          findings=$(jq '[.Results[]? | .Secrets[]?] | length' "$report")
          {
            echo '### Repository security gate'
            echo
            echo "- Attributed Python lock targets: ${package_targets} / 4"
            echo "- Unique Python packages represented: ${packages}"
            echo "- Fixed HIGH/CRITICAL vulnerabilities: ${vulnerabilities}"
            echo "- HIGH/CRITICAL misconfigurations: ${misconfigurations}"
            echo "- Gated credential-pattern findings: ${findings}"
            echo '- Scanner: Trivy v0.74.0'
            echo '- Dependency evidence: all four committed interpreter-specific hash locks are copied to scanner-recognized requirements.txt inputs; the validator requires every direct dependency at its exact resolved version in each attributed package inventory'
          } | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-security-evidence-${{ github.run_id }}
          path: |
            reports/security/trivy.json
            reports/security/summary.md
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: dependency-review
    needs: [supply-chain-policy]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe GitHub Dependency graph
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Dependency graph is unavailable; change-aware Dependency Review cannot run.'
            {
              echo '### Dependency Review fallback'
              echo
              echo 'GitHub Dependency graph is unavailable. Independent attributed Trivy scanning of every committed Python hash lock remains required.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Confirm fallback scope
        if: steps.dependency-graph.outputs.available != 'true'
        run: echo 'Dependency Review unavailable; attributed Trivy hash-lock scanning remains the independent dependency/configuration gate.'

  security-gate:
    name: security-gate
    if: always()
    needs: [supply-chain-policy, codeql, trivy, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require applicable security jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain-policy.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail
          [[ "$SUPPLY_CHAIN_RESULT" == "success" ]] || { echo "supply-chain-policy=$SUPPLY_CHAIN_RESULT"; exit 1; }
          [[ "$TRIVY_RESULT" == "success" ]] || { echo "trivy=$TRIVY_RESULT"; exit 1; }
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$DEPENDENCY_REVIEW_RESULT" == "success" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW_RESULT"; exit 1; }
            if [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
              [[ "$CODEQL_RESULT" == "success" ]] || { echo "codeql=$CODEQL_RESULT"; exit 1; }
            else
              [[ "$CODEQL_RESULT" == "skipped" ]] || { echo "fork-codeql=$CODEQL_RESULT"; exit 1; }
            fi
          else
            [[ "$CODEQL_RESULT" == "success" ]] || { echo "codeql=$CODEQL_RESULT"; exit 1; }
            [[ "$DEPENDENCY_REVIEW_RESULT" == "skipped" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW_RESULT"; exit 1; }
          fi
