name: Nasdaq July 31 cutoff price bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  bridge:
    if: github.head_ref == 'data-capture/nasdaq-smallcap-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download validated official exact-band capture
        uses: actions/download-artifact@v4
        with:
          name: nasdaq-smallcap-official-4c1cd5bc3b8f9d9d6537ee92c8f1623074811102
          path: official-capture
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: portyu9/qa-automation-python-pytest
          run-id: 30871955749

      - name: Fetch official Nasdaq cutoff closes
        id: bridge
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import pathlib
          import random
          import re
          import time
          import urllib.parse
          import urllib.request
          import zipfile
          from datetime import datetime, timezone

          OUT = pathlib.Path('nasdaq-cutoff-price-bridge')
          OUT.mkdir(parents=True, exist_ok=True)
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Accept-Language': 'en-US,en;q=0.9',
              'Origin': 'https://www.nasdaq.com',
              'Referer': 'https://www.nasdaq.com/market-activity/stocks/screener',
          }
          AUTHORITATIVE_PROHIBITED = {
              'TSLX','PBT','SBR','GSBD','ASA','KBDC','BBDC','MTAL','BCSF','PFLT',
              'NMFC','NCDL','TYG','CCAP','HCMA','TACO','SAR','CION','HRZN','LEGO',
          }

          def num(value):
              if value is None: return None
              text = str(value).replace(',', '').replace('$', '').replace('%', '').strip()
              if not text or text in {'--','N/A','NA'}: return None
              try: return float(text)
              except ValueError: return None

          def classify(row):
              symbol = str(row.get('symbol') or '').strip().upper()
              if symbol in AUTHORITATIVE_PROHIBITED: return 'PROHIBITED'
              name = str(row.get('name') or row.get('all_listed_name') or '')
              industry = str(row.get('industry') or '')
              listing = str(row.get('listing_security_name') or name)
              text = ' | '.join([name, industry, listing]).lower()
              is_adr = bool(re.search(r'\b(american depositar(?:y|ies)|american depositor(?:y|ies)|depositary receipt|depository receipt|\badr\b|\badss?\b)', text))
              prohibited = [
                  r'\b(warrant|warrants)\b',
                  r'\b(senior notes?|subordinated notes?|junior subordinated notes?|fixed[- ]rate notes?|reset[- ]rate notes?|notes? due|debentures?|bonds?)\b',
                  r'\btangible equity units?\b',
                  r'\b(blank check|shell company)\b',
                  r'\bbusiness development compan',
                  r'\bclosed[- ]end fund\b',
              ]
              if any(re.search(p, text) for p in prohibited): return 'PROHIBITED'
              if re.search(r'\b(right|rights)\b', text) and not re.search(r'human rights|rights management', text): return 'PROHIBITED'
              if re.search(r'\b(unit|units)\b', text) and re.search(r'(each unit|unit consists|units, each|acquisition.*unit|blank check)', text): return 'PROHIBITED'
              if re.search(r'\bpreferred (stock|share|shares|class)\b', text) or re.search(r'depositary shares.*preferred|depository shares.*preferred|trust preferred securities', text): return 'PROHIBITED'
              if not is_adr and re.search(r'\b(depositary|depository) shares?\b', text): return 'PROHIBITED'
              if re.search(r'\b(l\.p\.|\blp\b|limited partnership|master limited partnership)\b', text) and re.search(r'\b(common units?|limited partner interests?|partnership)\b', text): return 'PROHIBITED'
              if re.search(r'\b(fund|shares? of beneficial interest|cmn shs of bi|capital trust)\b', text) and not re.search(r'real estate investment trust', text): return 'PROHIBITED'
              if re.search(r'\binvestment company\b', text) and not re.search(r'investment company act compliance|software', text): return 'PROHIBITED'
              if re.search(r'\btrust\b', text) and re.search(r'finance|investment|municipal|income|credit|healthcare|health sciences|life sciences|beneficial', text) and not re.search(r'real estate investment trust', text): return 'PROHIBITED'
              if is_adr or re.search(r'\b(subordinate voting shares?|ordinary shares?|common(?: stock| shares?)?|class [abc](?: common)? shares?|real estate investment trust)\b', text): return 'COMMON'
              if re.search(r'\bwhen issued\b|\b(llc|limited liability company)\b', text): return 'REVIEW'
              if re.search(r'\b(inc\.?|incorporated|corporation|corp\.?|ltd\.?|limited|plc|s\.a\.?|bancorp|holdings?|pharmaceuticals?|resources?|energy|financial|commerce)\b', text): return 'COMMON'
              return 'REVIEW'

          def date_key(value):
              text = str(value or '').strip()
              for fmt in ('%Y-%m-%d','%m/%d/%Y','%b %d, %Y','%B %d, %Y','%m/%d/%Y %H:%M','%Y-%m-%dT%H:%M:%S'):
                  try:
                      source = text[:19] if 'T' in fmt else text
                      return datetime.strptime(source, fmt).date().isoformat()
                  except ValueError: pass
              m = re.search(r'(20\d{2})[-/](\d{1,2})[-/](\d{1,2})', text)
              if m: return f'{int(m.group(1)):04d}-{int(m.group(2)):02d}-{int(m.group(3)):02d}'
              return text or None

          def points(payload):
              data = payload.get('data') or {}
              out = {}
              chart = data.get('chart') or []
              if isinstance(chart, list):
                  for item in chart:
                      z = item.get('z') if isinstance(item, dict) and isinstance(item.get('z'), dict) else item
                      if not isinstance(z, dict): continue
                      d = date_key(z.get('dateTime') or z.get('date') or z.get('x'))
                      c = num(z.get('close') or z.get('closePrice') or z.get('y'))
                      if d and c is not None: out[d] = c
              rows = (((data.get('tradesTable') or {}).get('rows')) or [])
              if isinstance(rows, list):
                  for row in rows:
                      if not isinstance(row, dict): continue
                      d = date_key(row.get('date') or row.get('dateTime'))
                      c = num(row.get('close') or row.get('closePrice'))
                      if d and c is not None: out[d] = c
              return out

          source_files = list(pathlib.Path('official-capture').rglob('nasdaq-smallcap-enriched.json'))
          if len(source_files) != 1: raise SystemExit(f'enriched snapshot count={len(source_files)}')
          snapshot_bytes = source_files[0].read_bytes()
          rows = json.loads(snapshot_bytes)
          counts = {'COMMON':0,'PROHIBITED':0,'REVIEW':0}
          common = []
          for row in rows:
              kind = classify(row)
              counts[kind] += 1
              if kind == 'COMMON': common.append(row)
          (OUT/'classifier.json').write_text(json.dumps({'counts':counts}, indent=2)+'\n')
          if counts != {'COMMON':1296,'PROHIBITED':222,'REVIEW':0}:
              raise SystemExit(f'classifier drift: {counts}')

          def fetch(row):
              symbol = str(row.get('symbol') or '').strip().upper()
              encoded = urllib.parse.quote(symbol, safe='')
              requests = []
              for dates in [('2026-07-31','2026-08-03'),('07/31/2026','08/03/2026')]:
                  query = urllib.parse.urlencode({'assetclass':'stocks','fromdate':dates[0],'todate':dates[1]})
                  requests.append(f'https://api.nasdaq.com/api/quote/{encoded}/chart?{query}')
                  requests.append(f'https://api.nasdaq.com/api/quote/{encoded}/historical?{query}&limit=10')
              attempts = []
              last_raw = None
              for retry in range(4):
                  for url in requests:
                      try:
                          req = urllib.request.Request(url, headers=HEADERS)
                          with urllib.request.urlopen(req, timeout=45) as response:
                              raw = response.read()
                          last_raw = raw
                          p = points(json.loads(raw))
                          if '2026-07-31' in p and '2026-08-03' in p:
                              current_close = num(row.get('lastsale_numeric') or row.get('lastsale'))
                              current_cap = num(row.get('marketCap_numeric') or row.get('marketCap'))
                              implied_shares = current_cap/current_close if current_cap and current_close else None
                              cutoff_cap = implied_shares*p['2026-07-31'] if implied_shares else None
                              mismatch = ((current_close/p['2026-08-03'])-1)*100 if current_close and p['2026-08-03'] else None
                              return ({
                                  'symbol':symbol,'exchange':row.get('exchange'),'security_name':row.get('listing_security_name') or row.get('name'),
                                  'current_market_cap_usd':current_cap,'current_lastsale':current_close,
                                  'nasdaq_aug3_close':p['2026-08-03'],'nasdaq_jul31_close':p['2026-07-31'],
                                  'current_close_vs_aug3_pct':mismatch,'implied_current_shares':implied_shares,
                                  'price_bridged_cutoff_market_cap_usd':cutoff_cap,'historical_url':url,
                                  'historical_raw_sha256':hashlib.sha256(raw).hexdigest(),'status':'SUCCESS'
                              }, raw)
                          attempts.append({'url':url,'dates':sorted(p)})
                      except Exception as exc:
                          attempts.append({'url':url,'error':f'{type(exc).__name__}: {exc}'})
                  time.sleep((2**retry)*0.35 + random.random()*0.2)
              return ({'symbol':symbol,'exchange':row.get('exchange'),'security_name':row.get('listing_security_name') or row.get('name'),
                       'current_market_cap_usd':num(row.get('marketCap_numeric') or row.get('marketCap')),
                       'current_lastsale':num(row.get('lastsale_numeric') or row.get('lastsale')),
                       'status':'FAILED','attempts':attempts}, last_raw)

          results, raw_payloads = [], {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              future_map = {pool.submit(fetch,row):row.get('symbol') for row in common}
              for i,future in enumerate(concurrent.futures.as_completed(future_map),1):
                  result, raw = future.result()
                  results.append(result)
                  if raw is not None: raw_payloads[result['symbol']] = raw
                  if i % 100 == 0: print(f'completed {i}/1296', flush=True)
          results.sort(key=lambda x:x['symbol'])
          successes = [x for x in results if x['status']=='SUCCESS']
          failures = [x for x in results if x['status']!='SUCCESS']
          mismatches = [x for x in successes if x.get('current_close_vs_aug3_pct') is None or abs(x['current_close_vs_aug3_pct'])>0.75]
          in_band = [x for x in successes if x.get('price_bridged_cutoff_market_cap_usd') is not None and 300_000_000<=x['price_bridged_cutoff_market_cap_usd']<=2_000_000_000]
          below = [x for x in successes if x.get('price_bridged_cutoff_market_cap_usd') is not None and x['price_bridged_cutoff_market_cap_usd']<300_000_000]
          above = [x for x in successes if x.get('price_bridged_cutoff_market_cap_usd') is not None and x['price_bridged_cutoff_market_cap_usd']>2_000_000_000]
          (OUT/'cutoff-price-bridge.jsonl').write_text(''.join(json.dumps(x,sort_keys=True)+'\n' for x in results))
          (OUT/'failures.jsonl').write_text(''.join(json.dumps(x,sort_keys=True)+'\n' for x in failures))
          (OUT/'close-mismatches.jsonl').write_text(''.join(json.dumps(x,sort_keys=True)+'\n' for x in mismatches))
          with zipfile.ZipFile(OUT/'raw-responses.zip','w',zipfile.ZIP_DEFLATED) as zf:
              for symbol,raw in sorted(raw_payloads.items()): zf.writestr(f'{symbol}.json',raw)
          summary = {
              'record_type':'Framework_v2_R38_Nasdaq_cutoff_price_bridge','captured_at_utc':datetime.now(timezone.utc).isoformat(),
              'source':'Nasdaq official chart/historical API','source_snapshot_sha256':hashlib.sha256(snapshot_bytes).hexdigest(),
              'classification_counts':counts,'candidate_count':len(common),'success_count':len(successes),'failure_count':len(failures),
              'current_close_mismatch_count_over_0_75pct':len(mismatches),'price_bridged_in_band_count':len(in_band),
              'price_bridged_below_band_count':len(below),'price_bridged_above_band_count':len(above),
              'raw_response_count':len(raw_payloads),'complete_price_bridge':not failures and not mismatches,
          }
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          if failures or mismatches: raise SystemExit(2)
          PY

      - name: Upload cutoff bridge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cutoff-price-bridge-${{ github.event.pull_request.head.sha }}
          path: nasdaq-cutoff-price-bridge/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Enforce bridge success
        if: steps.bridge.outcome != 'success'
        run: exit 1
