name: Nasdaq cutoff-only 28 bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  bridge:
    if: github.head_ref == 'data-capture/nasdaq-smallcap-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Nasdaq capture
        uses: actions/download-artifact@v4
        with:
          name: nasdaq-smallcap-official-4c1cd5bc3b8f9d9d6537ee92c8f1623074811102
          path: official-capture
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: portyu9/qa-automation-python-pytest
          run-id: 30871955749
      - name: Fetch official historical closes for cutoff-only symbols
        id: bridge
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, random, re, time, urllib.parse, urllib.request, zipfile
          from datetime import datetime, timezone
          SYMBOLS=['ADMA','ALKT','AMRN','APPN','ASTH','AVEX','BFLY','BLKB','FLYW','GT','HCM','JAKK','LIND','LOB','NEO','NSP','NVA','PLBL','PRCH','PRDO','PVLA','SLS','TGLS','TILE','UFPT','UXIN','WGS','WU']
          OUT=pathlib.Path('nasdaq-cutoff-only-28-bridge');OUT.mkdir(parents=True,exist_ok=True)
          HEADERS={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137.0 Safari/537.36','Accept':'application/json, text/plain, */*','Accept-Language':'en-US,en;q=0.9','Origin':'https://www.nasdaq.com','Referer':'https://www.nasdaq.com/market-activity/stocks/screener'}
          def num(v):
            if v is None:return None
            t=str(v).replace(',','').replace('$','').replace('%','').strip()
            if not t or t in {'--','N/A','NA','UNCH'}:return None
            try:return float(t)
            except ValueError:return None
          def datekey(v):
            t=str(v or '').strip()
            for f in ('%Y-%m-%d','%m/%d/%Y','%b %d, %Y','%B %d, %Y','%m/%d/%Y %H:%M','%Y-%m-%dT%H:%M:%S'):
              try:return datetime.strptime(t[:19] if 'T' in f else t,f).date().isoformat()
              except ValueError:pass
            m=re.search(r'(20\d{2})[-/](\d{1,2})[-/](\d{1,2})',t)
            return f'{int(m.group(1)):04d}-{int(m.group(2)):02d}-{int(m.group(3)):02d}' if m else (t or None)
          def points(p):
            d=p.get('data') or {};out={}
            for item in d.get('chart') or []:
              z=item.get('z') if isinstance(item,dict) and isinstance(item.get('z'),dict) else item
              if isinstance(z,dict):
                k=datekey(z.get('dateTime') or z.get('date') or z.get('x'));c=num(z.get('close') or z.get('closePrice') or z.get('y'))
                if k and c is not None:out[k]=c
            for row in ((d.get('tradesTable') or {}).get('rows') or []):
              if isinstance(row,dict):
                k=datekey(row.get('date') or row.get('dateTime'));c=num(row.get('close') or row.get('closePrice'))
                if k and c is not None:out[k]=c
            return out
          files=list(pathlib.Path('official-capture').rglob('nasdaq-all-listed-official.json'))
          if len(files)!=1:raise SystemExit('all-listed file not unique')
          all_bytes=files[0].read_bytes();rows=(json.loads(all_bytes).get('data') or {}).get('rows') or [];by={str(r.get('symbol') or '').strip().upper():r for r in rows}
          def fetch(symbol):
            row=by.get(symbol); cap=num((row or {}).get('marketCap')); current=num((row or {}).get('lastsale'));pct=num((row or {}).get('pctchange'));enc=urllib.parse.quote(symbol,safe='');urls=[]
            for a,b in [('2026-07-31','2026-08-03'),('07/31/2026','08/03/2026')]:
              q=urllib.parse.urlencode({'assetclass':'stocks','fromdate':a,'todate':b});urls += [f'https://api.nasdaq.com/api/quote/{enc}/chart?{q}',f'https://api.nasdaq.com/api/quote/{enc}/historical?{q}&limit=10']
            attempts=[];last=None
            for retry in range(4):
              for url in urls:
                try:
                  req=urllib.request.Request(url,headers=HEADERS)
                  with urllib.request.urlopen(req,timeout=45) as response:raw=response.read()
                  last=raw;p=points(json.loads(raw))
                  if '2026-07-31' in p and '2026-08-03' in p:
                    shares=cap/current if cap and current else None;cut=shares*p['2026-07-31'] if shares else None;mismatch=((current/p['2026-08-03'])-1)*100 if current and p['2026-08-03'] else None
                    return ({'symbol':symbol,'name':(row or {}).get('name'),'current_market_cap':cap,'current_lastsale':current,'daily_pctchange':pct,'nasdaq_jul31_close':p['2026-07-31'],'nasdaq_aug3_close':p['2026-08-03'],'implied_current_shares':shares,'historical_cutoff_market_cap':cut,'current_close_vs_aug3_pct':mismatch,'url':url,'raw_sha256':hashlib.sha256(raw).hexdigest(),'status':'SUCCESS'},raw)
                  attempts.append({'url':url,'dates':sorted(p)})
                except Exception as exc:attempts.append({'url':url,'error':f'{type(exc).__name__}: {exc}'})
              time.sleep((2**retry)*.3+random.random()*.2)
            return ({'symbol':symbol,'name':(row or {}).get('name'),'current_market_cap':cap,'current_lastsale':current,'status':'FAILED','attempts':attempts},last)
          results=[];rawmap={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            for result,raw in pool.map(fetch,SYMBOLS):
              results.append(result)
              if raw is not None:rawmap[result['symbol']]=raw
          results.sort(key=lambda x:x['symbol']);fail=[r for r in results if r['status']!='SUCCESS'];mismatch=[r for r in results if r['status']=='SUCCESS' and (r.get('current_close_vs_aug3_pct') is None or abs(r['current_close_vs_aug3_pct'])>.75)]
          (OUT/'bridge.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in results));(OUT/'failures.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in fail));(OUT/'mismatches.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in mismatch))
          with zipfile.ZipFile(OUT/'raw-responses.zip','w',zipfile.ZIP_DEFLATED) as zf:
            for s,raw in sorted(rawmap.items()):zf.writestr(f'{s}.json',raw)
          summary={'record_type':'Framework_v2_R38_cutoff_only_28_bridge','captured_at_utc':datetime.now(timezone.utc).isoformat(),'requested_count':len(SYMBOLS),'success_count':len(results)-len(fail),'failure_count':len(fail),'mismatch_count':len(mismatch),'source_alllisted_sha256':hashlib.sha256(all_bytes).hexdigest(),'complete':not fail}
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n');print(json.dumps(summary,indent=2,sort_keys=True))
          if fail:raise SystemExit(2)
          PY
      - name: Upload targeted bridge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cutoff-only-28-${{ github.event.pull_request.head.sha }}
          path: nasdaq-cutoff-only-28-bridge/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Enforce targeted bridge success
        if: steps.bridge.outcome != 'success'
        run: exit 1
