name: docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate dependency lock provenance
        run: python .github/scripts/validate_dependency_locks.py
      - name: Validate security evidence policy
        run: python .github/scripts/test_security_evidence.py
      - name: Validate README contracts
        run: python .github/scripts/validate_readme.py
      - name: Validate immutable workflow dependencies
        run: python .github/scripts/validate_workflow_pins.py
