name: audit-zaproxy-lock-refresh

on:
  push:
    branches: [maintenance/zaproxy-direct-dependency]
    paths:
      - .github/workflows/audit-zaproxy-lock-refresh.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: audit-zaproxy-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-verified-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Verify source commit and workflow artifact provenance
        env:
          SOURCE_SHA: 8307bb3d510fdaf466e38f05d73d7dc7eac1ea07
          SOURCE_RUN_ID: "34264360443"
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          test "$(jq -r .name <<<"$run_json")" = "dependency-locks"
          test "$(jq -r .event <<<"$run_json")" = "pull_request"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .head_sha <<<"$run_json")" = "$SOURCE_SHA"
          test "$(jq -r .head_branch <<<"$run_json")" = "$GITHUB_REF_NAME"
      - name: Download exact verified lock artifacts
        env:
          SOURCE_RUN_ID: "34264360443"
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lock-artifacts
          mkdir lock-artifacts
          gh run download "$SOURCE_RUN_ID" --dir lock-artifacts --pattern 'python-*-lock'
          for version in 3.11 3.12 3.13 3.14; do
            test -s "lock-artifacts/python-${version}-lock/python-${version}.txt"
          done
      - name: Publish locks and provenance manifest
        shell: bash
        run: |
          set -euo pipefail
          for version in 3.11 3.12 3.13 3.14; do
            cp "lock-artifacts/python-${version}-lock/python-${version}.txt" "requirements-lock/python-${version}.txt"
          done
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          versions = ("3.11", "3.12", "3.13", "3.14")

          def blob_sha(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()

          source = Path("requirements.txt")
          manifest = {
              "schemaVersion": 1,
              "generator": {
                  "name": "pip-tools",
                  "version": "7.6.1",
                  "hashMode": "pip --require-hashes",
              },
              "source": {"path": "requirements.txt", "gitBlob": blob_sha(source)},
              "locks": [
                  {
                      "python": version,
                      "path": f"requirements-lock/python-{version}.txt",
                      "gitBlob": blob_sha(Path(f"requirements-lock/python-{version}.txt")),
                  }
                  for version in versions
              ],
          }
          Path("requirements-lock/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
          python3 .github/scripts/validate_dependency_locks.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements-lock
          git diff --cached --quiet && { echo 'No generated lock changes to publish.'; exit 0; }
          git commit -m 'chore: refresh ZAP dependency locks'
          git push origin "HEAD:${GITHUB_REF_NAME}"
