name: Nasdaq all-listed boundary bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  bridge:
    if: github.head_ref == 'data-capture/nasdaq-smallcap-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download validated Nasdaq capture
        uses: actions/download-artifact@v4
        with:
          name: nasdaq-smallcap-official-4c1cd5bc3b8f9d9d6537ee92c8f1623074811102
          path: official-capture
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: portyu9/qa-automation-python-pytest
          run-id: 30871955749
      - name: Bridge all cutoff-relevant symbols
        id: bridge
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, random, re, time, urllib.parse, urllib.request, zipfile
          from datetime import datetime, timezone
          OUT=pathlib.Path('nasdaq-alllisted-boundary-bridge'); OUT.mkdir(parents=True,exist_ok=True)
          HEADERS={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137.0 Safari/537.36','Accept':'application/json, text/plain, */*','Accept-Language':'en-US,en;q=0.9','Origin':'https://www.nasdaq.com','Referer':'https://www.nasdaq.com/market-activity/stocks/screener'}
          def num(v):
            if v is None:return None
            t=str(v).replace(',','').replace('$','').replace('%','').strip()
            if not t or t in {'--','N/A','NA','UNCH'}:return None
            try:return float(t)
            except ValueError:return None
          def datekey(v):
            t=str(v or '').strip()
            for f in ('%Y-%m-%d','%m/%d/%Y','%b %d, %Y','%B %d, %Y','%m/%d/%Y %H:%M','%Y-%m-%dT%H:%M:%S'):
              try:return datetime.strptime(t[:19] if 'T' in f else t,f).date().isoformat()
              except ValueError:pass
            m=re.search(r'(20\d{2})[-/](\d{1,2})[-/](\d{1,2})',t)
            return f'{int(m.group(1)):04d}-{int(m.group(2)):02d}-{int(m.group(3)):02d}' if m else (t or None)
          def points(payload):
            data=payload.get('data') or {}; out={}
            for item in data.get('chart') or []:
              z=item.get('z') if isinstance(item,dict) and isinstance(item.get('z'),dict) else item
              if isinstance(z,dict):
                d=datekey(z.get('dateTime') or z.get('date') or z.get('x')); c=num(z.get('close') or z.get('closePrice') or z.get('y'))
                if d and c is not None:out[d]=c
            for row in ((data.get('tradesTable') or {}).get('rows') or []):
              if isinstance(row,dict):
                d=datekey(row.get('date') or row.get('dateTime')); c=num(row.get('close') or row.get('closePrice'))
                if d and c is not None:out[d]=c
            return out
          all_files=list(pathlib.Path('official-capture').rglob('nasdaq-all-listed-official.json')); exact_files=list(pathlib.Path('official-capture').rglob('nasdaq-smallcap-enriched.json'))
          if len(all_files)!=1 or len(exact_files)!=1:raise SystemExit('official capture files not unique')
          all_bytes=all_files[0].read_bytes(); rows=(json.loads(all_bytes).get('data') or {}).get('rows') or []
          exact={str(r.get('symbol') or '').strip().upper() for r in json.loads(exact_files[0].read_bytes())}
          broad=[]
          for r in rows:
            s=str(r.get('symbol') or '').strip().upper(); cap=num(r.get('marketCap')); pct=num(r.get('pctchange')); cut=cap/(1+pct/100) if cap is not None and pct is not None and 1+pct/100>0 else None
            if s in exact or (cap is not None and 250_000_000<=cap<=2_500_000_000) or (cut is not None and 250_000_000<=cut<=2_500_000_000):
              broad.append({'symbol':s,'name':r.get('name'),'current_market_cap':cap,'current_lastsale':num(r.get('lastsale')),'daily_pctchange':pct,'daily_pct_derived_cutoff_cap':cut,'country':r.get('country'),'industry':r.get('industry')})
          seen=set(); broad=[r for r in broad if r['symbol'] and not (r['symbol'] in seen or seen.add(r['symbol']))]
          def fetch(row):
            s=row['symbol']; enc=urllib.parse.quote(s,safe=''); urls=[]
            for a,b in [('2026-07-31','2026-08-03'),('07/31/2026','08/03/2026')]:
              q=urllib.parse.urlencode({'assetclass':'stocks','fromdate':a,'todate':b}); urls += [f'https://api.nasdaq.com/api/quote/{enc}/chart?{q}',f'https://api.nasdaq.com/api/quote/{enc}/historical?{q}&limit=10']
            attempts=[]; last=None
            for retry in range(4):
              for url in urls:
                try:
                  req=urllib.request.Request(url,headers=HEADERS)
                  with urllib.request.urlopen(req,timeout=45) as response:raw=response.read()
                  last=raw; p=points(json.loads(raw))
                  if '2026-07-31' in p and '2026-08-03' in p:
                    cap=row['current_market_cap']; current=row['current_lastsale']; shares=cap/current if cap and current else None; cutoff=shares*p['2026-07-31'] if shares else None; mismatch=((current/p['2026-08-03'])-1)*100 if current and p['2026-08-03'] else None
                    return ({**row,'nasdaq_jul31_close':p['2026-07-31'],'nasdaq_aug3_close':p['2026-08-03'],'implied_current_shares':shares,'historical_price_bridged_cutoff_cap':cutoff,'current_close_vs_aug3_pct':mismatch,'historical_url':url,'raw_sha256':hashlib.sha256(raw).hexdigest(),'status':'SUCCESS'},raw)
                  attempts.append({'url':url,'dates':sorted(p)})
                except Exception as exc:attempts.append({'url':url,'error':f'{type(exc).__name__}: {exc}'})
              time.sleep((2**retry)*.3+random.random()*.2)
            return ({**row,'status':'FAILED','attempts':attempts},last)
          results=[]; rawmap={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
            fs={pool.submit(fetch,r):r['symbol'] for r in broad}
            for i,f in enumerate(concurrent.futures.as_completed(fs),1):
              result,raw=f.result(); results.append(result)
              if raw is not None:rawmap[result['symbol']]=raw
              if i%100==0:print(f'completed {i}/{len(broad)}',flush=True)
          results.sort(key=lambda x:x['symbol']); failures=[r for r in results if r['status']!='SUCCESS']; success=[r for r in results if r['status']=='SUCCESS']; mismatches=[r for r in success if r.get('current_close_vs_aug3_pct') is None or abs(r['current_close_vs_aug3_pct'])>.75]
          (OUT/'bridge.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in results)); (OUT/'failures.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in failures)); (OUT/'mismatches.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in mismatches))
          with zipfile.ZipFile(OUT/'raw-responses.zip','w',zipfile.ZIP_DEFLATED) as zf:
            for s,raw in sorted(rawmap.items()):zf.writestr(f'{s}.json',raw)
          summary={'record_type':'Framework_v2_R38_alllisted_boundary_bridge','captured_at_utc':datetime.now(timezone.utc).isoformat(),'source_alllisted_sha256':hashlib.sha256(all_bytes).hexdigest(),'broad_candidate_count':len(broad),'success_count':len(success),'failure_count':len(failures),'mismatch_count_over_0_75pct':len(mismatches),'raw_response_count':len(rawmap),'complete':not failures}
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n'); print(json.dumps(summary,indent=2,sort_keys=True))
          if failures:raise SystemExit(2)
          PY
      - name: Upload bridge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-alllisted-boundary-bridge-${{ github.event.pull_request.head.sha }}
          path: nasdaq-alllisted-boundary-bridge/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
      - name: Enforce bridge success
        if: steps.bridge.outcome != 'success'
        run: exit 1
